[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-version-checker"
dynamic = ["version"]
description = "Minecraft 服务端模组版本兼容性检查工具（升级前检查模组是否支持目标游戏版本与加载器）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["truststore>=0.10.4,<1; sys_platform == 'win32'"]
keywords = ["minecraft", "mod", "fabric", "neoforge", "forge", "modrinth", "server"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
dev = ["pytest>=7.4"]

[project.gui-scripts]
modcheck-gui = "modcheck.gui.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = {attr = "modcheck.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modcheck = ["py.typed"]
"modcheck.gui" = ["arrow-down*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "-m", "not live"]
markers = [
  "live: 需要真实网络访问的测试（默认跳过；用 -m live 显式运行）",
]
filterwarnings = ["error::DeprecationWarning:modcheck.*"]
